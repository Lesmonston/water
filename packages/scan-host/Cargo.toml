[package]
name = "water-scan-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
autobins = false
autotests = false
autoexamples = false
autobenches = false

[workspace]
members = ["."]
resolver = "3"

[lib]
name = "water_scan_host"
path = "src/lib.rs"

[[bin]]
name = "water-scan-host"
path = "src/main.rs"

[[test]]
name = "host_v1"
path = "tests/host_v1.rs"

[dependencies]
water-native-session = { path = "../native-session" }
water-native-scan = { path = "../native-scan" }
water-native-picker = { path = "../native-picker" }
water-scope-registry = { path = "../scope-registry" }
water-contracts = { path = "../../crates/water-contracts" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
