[workspace]
members = ["."]
resolver = "3"

[package]
name = "water-lab-session"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
autotests = false
autoexamples = false
autobenches = false
autobins = false

[lib]
name = "water_lab_session"
path = "src/lib.rs"

[[test]]
name = "session_v1"
path = "tests/session_v1.rs"

[dependencies]
water-contracts = { path = "../../crates/water-contracts" }
water-scan = { path = "../fixture-scan" }
water-scan-report = { path = "../scan-report" }
water-report-view = { path = "../report-view" }
water-summary-export = { path = "../summary-export" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
