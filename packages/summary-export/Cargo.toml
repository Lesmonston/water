[workspace]
members = ["."]
resolver = "3"

[package]
name = "water-summary-export"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
autotests = false
autoexamples = false
autobenches = false
autobins = false

[lib]
name = "water_summary_export"
path = "src/lib.rs"

[[test]]
name = "export_v1"
path = "tests/export_v1.rs"

[dependencies]
water-contracts = { path = "../../crates/water-contracts" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
