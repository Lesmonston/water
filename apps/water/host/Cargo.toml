[package]
name = "water-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
autobins = false
autotests = false
autoexamples = false
autobenches = false

[workspace]

[lib]
name = "water_desktop"
path = "src/lib.rs"

[[bin]]
name = "water"
path = "src/main.rs"

[[test]]
name = "host_v1"
path = "tests/host_v1.rs"

[dependencies]
tauri = { version = "=2.12.5", default-features = false, features = ["wry", "common-controls-v6"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
water-native-picker = { path = "../../../packages/native-picker" }
water-contracts = { path = "../../../crates/water-contracts" }
water-scope-registry = { path = "../../../packages/scope-registry" }

[build-dependencies]
tauri-build = "=2.7.4"
