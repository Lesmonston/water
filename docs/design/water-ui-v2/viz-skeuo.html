<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1300">
<title>Water 冰山可视化</title>
<link rel="stylesheet" href="tokens.css">
<style>
/* Design prototype only (wave 10, skeuomorphic visualisation). One iceberg in one sea:
   above the water = what Water can clean (area ∝ bytes); the waterline is split into drive partitions
   (width ∝ capacity), each partition's submerged region area ∝ capacity, solid ice = used, clear band = free.
   All drawing is inline SVG built with DOM calls; tokens.css supplies colours, type and motion. */
/* token fallbacks (same values as tokens.css), so the page still renders if tokens.css is not next to it */
:root{--w-ink:#10263F;--w-ink-2:rgba(16,38,63,.66);--w-ink-3:rgba(16,38,63,.48);--w-ink-4:rgba(16,38,63,.28);--w-hairline:rgba(16,38,63,.07);
 --w-glass:rgba(255,255,255,.74);--w-glass-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 0 0 1px rgba(255,255,255,.7),0 1px 2px rgba(16,38,63,.04),0 14px 34px -18px rgba(16,38,63,.16);
 --w-accent:#1F6FD1;--w-accent-hover:#1A62BA;--w-accent-soft:#E4EFFB;--w-water:#9CCBF4;--w-water-deep:#6EAEEB;
 --w-level-recommended:#2A9D8F;--w-level-confirm:#D49A3E;--w-level-advisory:#9AA7B6;--w-level-protected:#8E84D8;
 --w-growth:#B5652A;--w-danger:#C23B45;--w-success:#2A8F6E;
 --w-font:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","PingFang SC",system-ui,sans-serif;
 --w-font-display:"Segoe UI Variable Display","Segoe UI","Microsoft YaHei UI",system-ui,sans-serif;--w-font-mono:"Cascadia Mono",Consolas,monospace;
 --w-ease:cubic-bezier(.22,.8,.2,1)}
/* the text panel on the left of every scene */
.panel{position:absolute;padding:16px 18px 16px;border-radius:20px;background:rgba(255,255,255,.84);backdrop-filter:blur(24px) saturate(120%);
 box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(255,255,255,.8),0 1px 2px rgba(16,38,63,.05),0 22px 50px -26px rgba(16,38,63,.3);display:flex;flex-direction:column;overflow:hidden;z-index:2}
.ptitle{font-family:var(--w-font-display);font-weight:600;font-size:21px;letter-spacing:-.02em;line-height:1.28}
.panel>*{flex-shrink:0}
.pcap{font-size:12.5px;color:var(--w-ink-2);line-height:1.55;margin-top:3px}
.pcap b{color:var(--w-ink)}
.eyebrow.pe{margin-top:9px;font-size:13px}
.panel .hero{font-size:48px;margin-top:0;letter-spacing:-.045em}
.panel .hero small{font-size:19px;margin-left:6px}
.ptop{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.ptop .link{font-size:12.5px}
.psec{display:flex;align-items:baseline;gap:8px;font-weight:600;font-size:13px;margin:8px 0 2px;padding-top:8px;border-top:1px solid var(--w-hairline);white-space:nowrap}
.psec .pr{margin-left:auto;font-family:var(--w-font-display);font-size:13.5px;font-weight:600}
.psec small{font-weight:400;color:var(--w-ink-3);font-size:11.5px;font-family:var(--w-font)}
.prow{display:flex;align-items:center;gap:8px;min-height:23px;font-size:12.5px;border-radius:8px;padding:0 8px;margin:0 -8px;white-space:nowrap;transition:background .15s}
.prow .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
.prow .sz{margin-left:auto;font-weight:600;white-space:nowrap}
.prow .px{color:var(--w-ink-3);font-size:11.5px;white-space:nowrap;min-width:44px;text-align:right}
.prow .cs{width:10px;height:10px;border-radius:3px;flex:none;box-shadow:inset 0 0 0 1px rgba(16,38,63,.1)}
.prow .pic{width:15px;display:inline-grid;place-items:center;flex:none}
.prow .num{width:16px;height:16px;border-radius:50%;background:var(--w-ink);color:#fff;font-size:10px;display:inline-grid;place-items:center;flex:none;font-weight:600}
.prow.hot,.drow.hot,.qrow.hot{background:var(--w-accent-soft)}
.prow.off .nm,.prow.off .sz{text-decoration:line-through;color:var(--w-ink-3)}
.prow.click{cursor:pointer}
.prow.dim{opacity:.32}
.mut,.sz.mut{color:var(--w-ink-3);font-weight:400}
.warn,.sz.warn{color:#9A6418;font-weight:650}
.sz.acc{color:var(--w-accent);font-weight:600;font-size:12px}
.okt,.sz.okt,.px.okt{color:var(--w-success);font-weight:650}
.mono{font-family:var(--w-font-mono);font-size:12px}
.pq{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--w-ink-2);padding:7px 10px;border-radius:12px;background:rgba(255,255,255,.75);box-shadow:inset 0 0 0 1px rgba(181,101,42,.2);margin-bottom:14px;white-space:nowrap}
.pq svg.i{color:var(--w-growth);width:15px;height:15px}.pq b{color:var(--w-ink)}.pq .link{margin-left:auto;font-size:12.5px}
.drow{padding:2px 8px;margin:0 -8px;border-radius:9px;font-size:12.5px;transition:background .15s}
.drow .l1{display:flex;gap:7px;align-items:center}
.drow .l1 i{width:7px;height:7px;border-radius:50%;background:var(--w-level-confirm);flex:none}
.drow .l1 .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.drow .l1 .sz{font-weight:600;white-space:nowrap}
.drow .l2{display:flex;gap:6px;align-items:center;margin:1px 0 0 14px;min-height:22px}
.drow .ev,.qrow .ev{flex:1;min-width:0;color:var(--w-ink-3);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .ev.grow{color:var(--w-growth)}
.drow .btn{height:22px;padding:0 11px;font-size:12px}
.drow .dn{display:none;flex:1;color:var(--w-ink-2);font-size:12px}
.drow.decided .btn,.drow.decided .ev{display:none}.drow.decided .dn{display:block}
.drow.sel{background:rgba(212,154,62,.08)}
.qrow{padding:8px 8px;margin:4px -8px 0;border-radius:10px;font-size:12.5px;border-top:1px solid var(--w-hairline)}
.qrow .l1{display:flex;align-items:baseline;gap:8px}.qrow .l1 .sz{margin-left:auto;font-weight:600}
.qrow .meter{display:flex;gap:3px;align-items:center;margin:6px 0 2px}
.qrow .meter i{width:20px;height:5px;border-radius:3px;background:rgba(16,38,63,.08)}
.qrow .meter i.on{background:#B9CFE3}
.qrow .meter .mut{margin-left:8px;font-size:11.5px}
.qrow .warnline{font-size:12px;color:#9A6418;margin-top:2px}
.qrow .bt{display:flex;gap:14px;align-items:center;margin-top:6px}
.qrow .bt .link{font-size:12.5px}
.qrow .dn{font-size:12px;color:var(--w-ink-2);margin-top:6px}
.qrow .dn:empty{display:none}
.pfoot{margin-top:auto;padding-top:12px}
.pbtn{width:100%}
.legend.wrap{flex-wrap:wrap;gap:6px 14px;margin-top:4px}
*{box-sizing:border-box}html,body{margin:0}
body{font:14px/1.5 var(--w-font);color:var(--w-ink);padding:14px;min-width:1300px;font-feature-settings:"tnum";
 background:radial-gradient(1100px 680px at 18% 6%,#DCEAF7 0%,transparent 62%),radial-gradient(900px 640px at 88% 92%,#E3EDF6 0%,transparent 60%),#EEF2F7}
body.shot{height:900px;overflow:hidden}
button{font:inherit;color:inherit}
/* design-only switcher */
.bar{width:1272px;margin:0 auto 12px;display:flex;flex-wrap:wrap;gap:2px;align-items:center;padding:5px;border-radius:22px;background:rgba(255,255,255,.72);box-shadow:var(--w-glass-shadow)}
.bar strong{font-size:12px;color:var(--w-ink-3);padding:0 10px 0 12px;font-weight:500}
.bar button{border:0;background:none;border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--w-ink-2);cursor:pointer}
.bar button[aria-pressed=true]{background:#fff;color:var(--w-ink);box-shadow:0 1px 3px rgba(16,38,63,.12)}
.bar .sp{flex:1}.bar .play{color:var(--w-accent);font-weight:600}
body.shot .bar{display:none}
/* window */
.win{position:relative;width:1272px;height:872px;margin:0 auto;border-radius:12px;overflow:hidden;background:rgba(248,250,253,.9);box-shadow:0 0 0 1px rgba(16,38,63,.08),0 40px 90px -30px rgba(16,38,63,.35)}
.ambient{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(40px)}
.orb.a{width:760px;height:560px;left:160px;top:-300px;background:radial-gradient(closest-side,rgba(198,224,248,.7),rgba(198,224,248,0))}
.orb.b{width:640px;height:640px;right:-220px;top:120px;background:radial-gradient(closest-side,rgba(214,230,246,.55),rgba(214,230,246,0))}
.titlebar{position:absolute;right:0;top:0;height:40px;display:flex;z-index:6;color:var(--w-ink-2)}
.titlebar span{width:46px;height:40px;display:grid;place-items:center}.titlebar svg{width:14px;height:14px}
.side{position:absolute;left:0;top:0;bottom:0;width:184px;padding:14px 10px 16px;display:flex;flex-direction:column;background:rgba(255,255,255,.34);box-shadow:inset -1px 0 0 rgba(16,38,63,.05);z-index:3}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 24px}
.brand b{font-family:var(--w-font-display);font-weight:600;font-size:18px;letter-spacing:-.01em;display:block;line-height:1.2}
.brand small{display:block;font-size:11px;color:var(--w-ink-3)}
.nav a{display:flex;align-items:center;gap:11px;height:38px;padding:0 12px;border-radius:11px;color:var(--w-ink-2);margin-bottom:3px;font-size:13.5px;cursor:pointer}
.nav a.on{color:var(--w-ink);font-weight:600;background:rgba(255,255,255,.9);box-shadow:0 0 0 1px rgba(16,38,63,.05),0 2px 8px -4px rgba(16,38,63,.12)}
.nav a.on svg{color:var(--w-accent)}
.nav a .badge{margin-left:auto;font-size:11px;color:var(--w-growth);font-weight:600}
.side-bottom{margin-top:auto}
.side-note{font-size:11px;color:var(--w-ink-3);padding:8px 12px 2px;line-height:1.6}
.dotlive{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--w-level-recommended);margin-right:6px;vertical-align:1px}
svg.i{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.content{position:absolute;left:184px;top:0;width:1088px;height:872px;z-index:1;overflow:hidden}
.scene{position:absolute;inset:0;display:none}.scene.on{display:block}
svg.stage{position:absolute;left:0;top:0;width:1088px;height:872px;overflow:visible}
.ab{position:absolute}
/* type */
.h1{font-family:var(--w-font-display);font-weight:600;font-size:24px;letter-spacing:-.02em;line-height:1.25;margin:0;white-space:nowrap}
.sub{color:var(--w-ink-2);font-size:13.5px;margin:0;white-space:nowrap}
.cap{color:var(--w-ink-3);font-size:12.5px;white-space:nowrap}
.eyebrow{font-size:13.5px;color:var(--w-ink-2);white-space:nowrap}
.hero{font-family:var(--w-font-display);font-weight:200;font-size:80px;letter-spacing:-.045em;line-height:1;white-space:nowrap}
.hero small{font-size:24px;font-weight:300;letter-spacing:0;margin-left:8px;color:var(--w-ink-2)}
.mk{font-size:13px;color:var(--w-ink-2);white-space:nowrap}.mk .sep{color:var(--w-ink-4);margin:0 7px}.mk .up{color:var(--w-growth)}.mk .skip{color:var(--w-ink-3)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 22px;border-radius:999px;border:0;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .2s,transform .2s var(--w-ease)}
.btn:active{transform:scale(.98)}
.btn-primary{color:#fff;background:var(--w-accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 6px 16px -8px rgba(31,111,209,.55)}
.btn-primary:hover{background:var(--w-accent-hover)}
.btn-primary[disabled]{background:rgba(16,38,63,.16);box-shadow:none;cursor:default}
.btn-glass{color:var(--w-ink);background:rgba(255,255,255,.92);box-shadow:0 0 0 1px rgba(16,38,63,.08),0 1px 2px rgba(16,38,63,.05)}
.btn-outline{color:var(--w-accent);background:rgba(255,255,255,.8);box-shadow:inset 0 0 0 1.2px rgba(31,111,209,.55)}
.btn-sm{height:30px;padding:0 15px;font-size:12.5px}
.btn-xs{height:26px;padding:0 12px;font-size:12px}
.link{border:0;background:none;padding:2px 4px;border-radius:6px;color:var(--w-accent);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;font-size:13.5px}
.link.danger{color:var(--w-danger)}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:rgba(16,38,63,.05)}
.seg button{border:0;background:none;padding:4px 13px;border-radius:999px;font-size:12.5px;color:var(--w-ink-2);cursor:pointer;white-space:nowrap}
.seg button.on{background:#fff;color:var(--w-ink);font-weight:600;box-shadow:0 1px 3px rgba(16,38,63,.1)}
/* resident quarantine bar */
.qbar{display:flex;align-items:center;gap:12px;padding:0 10px 0 16px;height:42px;border-radius:15px;background:rgba(255,255,255,.62);box-shadow:inset 0 0 0 1px rgba(181,101,42,.18);font-size:13px;color:var(--w-ink-2);white-space:nowrap}
.qbar svg.i{color:var(--w-growth)}.qbar b{color:var(--w-ink)}.qbar .sp{flex:1}
/* chips */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 15px 0 11px;border-radius:999px;border:0;background:rgba(255,255,255,.9);box-shadow:0 0 0 1px rgba(16,38,63,.09);cursor:pointer;font-size:13.5px;white-space:nowrap}
.chip .tick{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1.3px rgba(16,38,63,.28);display:grid;place-items:center}
.chip.on{background:var(--w-accent-soft);color:var(--w-accent);font-weight:600;box-shadow:0 0 0 1.2px rgba(31,111,209,.45)}
.chip.on .tick{background:var(--w-accent);box-shadow:none}
.chip.on .tick::after{content:"";width:7px;height:4px;border:1.8px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(.5px,-1px)}
.chip small{font-weight:400;color:var(--w-ink-3);font-size:12px}
.chip.add{color:var(--w-ink-2);box-shadow:0 0 0 1px rgba(16,38,63,.12) inset;background:transparent}
/* tip labels */
.lbl{position:absolute;font-size:12px;line-height:1.25;white-space:nowrap;cursor:pointer;padding:2px 0}
.lbl .n{color:var(--w-ink-2)}.lbl .v{font-weight:650;color:var(--w-ink);margin-left:6px}
.lbl i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--w-level-recommended)}
.lbl.chosen i{background:var(--w-level-confirm)}
.lbl.off .n,.lbl.off .v{text-decoration:line-through;color:var(--w-ink-3)}
.lbl .x{color:var(--w-ink-3);margin-left:6px;font-size:11.5px}
/* decision cards */
.rcard{position:absolute;width:198px;padding:9px 11px 10px 12px;border-radius:14px;background:rgba(255,255,255,.84);box-shadow:var(--w-glass-shadow);font-size:12.5px;line-height:1.35;transition:opacity .3s}
.rcard .hd{display:flex;gap:7px;align-items:flex-start;min-height:34px}
.rcard .hd i{width:6px;height:6px;border-radius:50%;background:var(--w-level-confirm);flex:none;margin-top:5px}
.rcard .nm{flex:1;font-weight:600}
.rcard .gb{font-weight:600;font-family:var(--w-font-display);font-size:14px;white-space:nowrap}
.rcard .ev{color:var(--w-ink-3);font-size:11.5px;margin:2px 0 7px 13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcard .ev.grow{color:var(--w-growth)}
.rcard .bt{display:flex;gap:6px;margin-left:13px}.rcard .bt .btn{flex:1}
.rcard .done{display:none;margin-left:13px;color:var(--w-ink-2);font-size:12px;align-items:center;gap:6px;height:26px}
.rcard.decided .bt{display:none}.rcard.decided .done{display:flex}
.rcard.kept{opacity:.72}
/* misc glass */
.glass{background:var(--w-glass);border-radius:18px;box-shadow:var(--w-glass-shadow)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--w-ink-2);white-space:nowrap;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:14px;height:10px;border-radius:3px}
.steprow{display:flex;align-items:center;gap:10px;height:40px;font-size:13px;border-top:1px solid var(--w-hairline)}
.steprow:first-child{border-top:0}
.steprow .st{margin-left:auto;color:var(--w-ink-3);font-size:12.5px}
.steprow .st.ok{color:var(--w-ink)}
.spin{display:inline-block;vertical-align:-2px;width:14px;height:14px;border-radius:50%;border:1.6px solid rgba(31,111,209,.2);border-top-color:var(--w-accent)}
.wait{display:inline-block;vertical-align:-2px;width:14px;height:14px;border-radius:50%;border:1.6px dashed rgba(16,38,63,.25)}
.okc{width:14px;height:14px;color:var(--w-success)}
.note{font-size:12px;color:var(--w-ink-3);line-height:1.55}
.tag{position:absolute;font-size:11.5px;line-height:1.3;white-space:nowrap;color:var(--w-ink-2)}
.tag b{color:var(--w-ink);font-weight:650}
.foldrow{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--w-ink-2);white-space:nowrap}
.foldrow i{width:6px;height:6px;border-radius:50%;display:inline-block}
@media (prefers-reduced-motion: reduce){.btn,.rcard{transition:none}}
</style>
</head>

 },

   let best=null,bv=0;CAT.forEach(c=>{const d=(b[c.id]||0)-(a[c.id]||0);if(d>bv){bv=d;best=c;}});

   const x=lerp(x0,x1,q)+Math.sin(q*6+i)*5*(1-q),y=lerp(y0,y1-9,q)-12*fz;drawChunk(this.under,shapeOf('r'+i,500+i),x,y,inc*M.k*fuse*fuse,{color:best?best.c:null,op:clamp(q*5)*fuse});

   for(let m=0;m<8;m++){const age=t-t0-m*1600;if(age<0||age>2600)continue;const q=age/2600,rr=10+q*Rm,fo=Math.pow(1-q,.8);

    S('circle',{cx:R.cx,cy:yw,r:Math.max(1,rr-10),fill:'none',stroke:'var(--w-accent)','stroke-width':1.2,opacity:(.55*fo).toFixed(3)},h.sonar);}}
