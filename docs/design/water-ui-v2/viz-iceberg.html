<link rel="stylesheet" href="tokens.css">
<style>
/* Design prototype only (wave 10). The iceberg is ASSEMBLED from pieces while the scan runs:
   a precomputed silhouette is cut into a jigsaw (power-diagram cells with shared edges), tip = one piece per
   recommended category, body = one region per drive (free band on top, needs-review items, protected data, plain ice).
   Picture style: calm, clean, softly shaded chunky tiles in a quiet teal-to-blue sea with lots of empty space,
   drawn smoothly into one full-resolution canvas. Tags and the panel are crisp UI on top. No images, no network. */
/* token fallbacks (same values as tokens.css), so the page still renders if tokens.css is not next to it */
:root{--w-ink:#10263F;--w-ink-2:rgba(16,38,63,.66);--w-ink-3:rgba(16,38,63,.48);--w-ink-4:rgba(16,38,63,.28);--w-hairline:rgba(16,38,63,.07);
 --w-accent:#1F6FD1;--w-accent-hover:#1A62BA;--w-accent-soft:#E4EFFB;
 --w-level-recommended:#2A9D8F;--w-level-confirm:#D49A3E;--w-level-advisory:#9AA7B6;--w-level-protected:#8E84D8;
 --w-growth:#B5652A;--w-danger:#C23B45;--w-success:#2A8F6E;
 --w-font:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","PingFang SC",system-ui,sans-serif;
 --w-font-display:"Segoe UI Variable Display","Segoe UI","Microsoft YaHei UI",system-ui,sans-serif;--w-font-mono:"Cascadia Mono",Consolas,monospace;
 --w-ease:cubic-bezier(.22,.8,.2,1)}
*{box-sizing:border-box}html,body{margin:0}
body{font:14px/1.5 var(--w-font);color:var(--w-ink);padding:14px;min-width:1300px;font-feature-settings:"tnum";background:#E6EEF1}
body.shot{height:900px;overflow:hidden}
button{font:inherit;color:inherit}
/* design-only switcher */
.bar{width:1272px;margin:0 auto 12px;display:flex;flex-wrap:wrap;gap:2px;align-items:center;padding:5px;border-radius:22px;background:rgba(255,255,255,.85);box-shadow:0 0 0 1px rgba(20,50,70,.08)}
.bar strong{font-size:12px;color:var(--w-ink-3);padding:0 10px 0 12px;font-weight:500}
.bar button{border:0;background:none;border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--w-ink-2);cursor:pointer}
.bar button[aria-pressed=true]{background:#fff;color:var(--w-ink);box-shadow:0 1px 3px rgba(16,38,63,.12)}
.bar .sp{flex:1}.bar .play{color:var(--w-accent);font-weight:600}
body.shot .bar{display:none}
/* window */
.win{position:relative;width:1272px;height:872px;margin:0 auto;border-radius:14px;overflow:hidden;background:#F4F8F9;box-shadow:0 0 0 1px rgba(20,50,70,.1),0 36px 80px -36px rgba(20,60,90,.4)}
.titlebar{position:absolute;right:0;top:0;height:40px;display:flex;z-index:6;color:rgba(30,60,80,.6)}
.titlebar span{width:46px;height:40px;display:grid;place-items:center}.titlebar svg{width:14px;height:14px}
.side{position:absolute;left:0;top:0;bottom:0;width:184px;padding:14px 10px 16px;display:flex;flex-direction:column;background:#FBFCFD;box-shadow:inset -1px 0 0 rgba(20,50,70,.08);z-index:3}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 24px}
.brand b{font-family:var(--w-font-display);font-weight:600;font-size:18px;letter-spacing:-.01em;display:block;line-height:1.2}
.brand small{display:block;font-size:11px;color:var(--w-ink-3)}
.nav a{display:flex;align-items:center;gap:11px;height:38px;padding:0 12px;border-radius:12px;color:var(--w-ink-2);margin-bottom:3px;font-size:13.5px;cursor:pointer}
.nav a.on{color:var(--w-ink);font-weight:600;background:#fff;box-shadow:0 0 0 1px rgba(20,50,70,.06),0 4px 12px -6px rgba(20,60,90,.22)}
.nav a.on svg{color:var(--w-accent)}
.nav a .badge{margin-left:auto;font-size:11px;color:var(--w-growth);font-weight:600}
.side-bottom{margin-top:auto}
.side-note{font-size:11px;color:var(--w-ink-3);padding:8px 12px 2px;line-height:1.6}
.dotlive{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--w-level-recommended);margin-right:6px;vertical-align:1px}
svg.i{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.content{position:absolute;left:184px;top:0;width:1088px;height:872px;z-index:1;overflow:hidden;background:#5FA9B4}
.scene{position:absolute;inset:0;display:none}.scene.on{display:block}
.ab{position:absolute}
canvas.pic{position:absolute;left:0;top:0;width:1088px;height:872px}
.layer{position:absolute;left:0;top:0;width:1088px;height:872px;overflow:visible;pointer-events:none}
.tags{filter:drop-shadow(0 4px 8px rgba(20,50,75,.22))}
.tagt{font-family:"Microsoft YaHei UI","Microsoft YaHei","Segoe UI",sans-serif}
/* the text panel: clean, light, rounded */
.panel{position:absolute;padding:16px 18px 16px;border-radius:22px;background:rgba(255,255,255,.94);box-shadow:0 0 0 1px rgba(20,50,70,.06),0 22px 48px -26px rgba(20,60,90,.45);display:flex;flex-direction:column;overflow:hidden;z-index:5}
.ptitle{font-family:var(--w-font-display);font-weight:600;font-size:21px;letter-spacing:-.02em;line-height:1.28}
.panel>*{flex-shrink:0}
.pcap{font-size:12.5px;color:var(--w-ink-2);line-height:1.55;margin-top:3px}
.pcap b{color:var(--w-ink)}
.eyebrow{font-size:13.5px;color:var(--w-ink-2);white-space:nowrap}
.eyebrow.pe{margin-top:9px;font-size:13px}
.hero{font-family:var(--w-font-display);font-weight:200;font-size:80px;letter-spacing:-.045em;line-height:1;white-space:nowrap}
.hero small{font-size:24px;font-weight:300;letter-spacing:0;margin-left:8px;color:var(--w-ink-2)}
.panel .hero{font-size:48px;margin-top:0}
.panel .hero small{font-size:19px;margin-left:6px}
.ptop{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.ptop .link{font-size:12.5px}
.psec{display:flex;align-items:baseline;gap:8px;font-weight:600;font-size:13px;margin:7px 0 2px;padding-top:7px;border-top:1px solid rgba(20,50,70,.08);white-space:nowrap}
.psec .pr{margin-left:auto;font-family:var(--w-font-display);font-size:13.5px;font-weight:600}
.psec small{font-weight:400;color:var(--w-ink-3);font-size:11.5px;font-family:var(--w-font)}
.prow{display:flex;align-items:center;gap:8px;min-height:22px;font-size:12.5px;border-radius:8px;padding:0 8px;margin:0 -8px;white-space:nowrap;transition:background .15s}
.prow .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
.prow .sz{margin-left:auto;font-weight:600;white-space:nowrap}
.prow .px{color:var(--w-ink-3);font-size:11.5px;white-space:nowrap;min-width:44px;text-align:right}
.cs{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block;position:relative}
.cs.rv::after{content:"";position:absolute;right:-4px;top:-4px;width:6px;height:6px;border-radius:50%;background:#E3A647;box-shadow:0 0 0 1.5px #fff}
.prow .pic{width:15px;display:inline-grid;place-items:center;flex:none}
.prow.hot,.drow.hot{background:var(--w-accent-soft)}
.prow.off .nm,.prow.off .sz{text-decoration:line-through;color:var(--w-ink-3)}
.prow.click{cursor:pointer}
.prow.dim{opacity:.32}
.mut,.sz.mut{color:var(--w-ink-3);font-weight:400}
.warn,.sz.warn{color:#9A6418;font-weight:650}
.sz.acc{color:var(--w-accent);font-weight:600;font-size:12px}
.okt,.sz.okt,.px.okt{color:var(--w-success);font-weight:650}
.drow{padding:1px 8px;margin:0 -8px;border-radius:9px;font-size:12.5px;transition:background .15s}
.drow .l1{display:flex;gap:8px;align-items:center}
.drow .l1 .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.drow .l1 .sz{font-weight:600;white-space:nowrap}
.drow .l2{display:flex;gap:6px;align-items:center;margin:1px 0 0 18px;min-height:21px}
.drow .ev{flex:1;min-width:0;color:var(--w-ink-3);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .ev.grow{color:var(--w-growth)}
.drow .btn{height:21px;padding:0 11px;font-size:12px}
.drow .dn{display:none;flex:1;color:var(--w-ink-2);font-size:12px}
.drow.decided .btn,.drow.decided .ev{display:none}.drow.decided .dn{display:block}
.pnote{font-size:11.5px;color:var(--w-ink-3);line-height:1.35;margin:0 0 2px;white-space:nowrap}
.pfoot{margin-top:auto;padding-top:12px}
.pbtn{width:100%}
/* buttons: one solid primary per screen */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 22px;border-radius:999px;border:0;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .2s,transform .2s var(--w-ease)}
.btn:active{transform:scale(.98)}
.btn-primary{color:#fff;background:var(--w-accent);box-shadow:0 8px 18px -10px rgba(31,111,209,.7)}
.btn-primary:hover{background:var(--w-accent-hover)}
.btn-glass{color:var(--w-ink);background:#fff;box-shadow:0 0 0 1px rgba(20,50,70,.12),0 1px 2px rgba(20,50,70,.06)}
.btn-outline{color:var(--w-accent);background:#fff;box-shadow:inset 0 0 0 1.2px rgba(31,111,209,.55)}
.btn-sm{height:30px;padding:0 15px;font-size:12.5px}
.link{border:0;background:none;padding:2px 4px;border-radius:6px;color:var(--w-accent);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;font-size:13.5px}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:rgba(20,50,70,.06)}
.seg button{border:0;background:none;padding:4px 13px;border-radius:999px;font-size:12.5px;color:var(--w-ink-2);cursor:pointer;white-space:nowrap}
.seg button.on{background:#fff;color:var(--w-ink);font-weight:600;box-shadow:0 1px 3px rgba(16,38,63,.1)}
.spin{display:inline-block;vertical-align:-2px;width:14px;height:14px;border-radius:50%;border:1.6px solid rgba(31,111,209,.2);border-top-color:var(--w-accent)}
.wait{display:inline-block;vertical-align:-2px;width:14px;height:14px;border-radius:50%;border:1.6px dashed rgba(16,38,63,.25)}
.okc{width:14px;height:14px;color:var(--w-success)}
@media (prefers-reduced-motion: reduce){.btn{transition:none}}
</style>

/* ---------- the tip: a cluster of shards, one shard group per recommended category ---------- */
function buildTip(){

/* Add sharp shards along a cell's outer (sky-facing) edges; shards point upward and outward, never back into the berg.

  const setLoc=(r,mode,txt)=>{setIc(r,mode);r._s.textContent=txt;r._s.classList.toggle('mut',mode!=='ok');};
  const cD=SCAN.win.C[1]+60,fD=SCAN.win.F[1]+60;
  setLoc(this.loc[0],t<cD?'run':'ok',t<cD?'扫描中':'14.0 GB');
  setLoc(this.loc[1],t<cD?'wait':(t<fD?'run':'ok'),t<cD?'等待':(t<fD?'扫描中':'1.4 GB'));
  const fl=Math.round(182340*clamp(t/5800)),sec=Math.round(48*clamp(t/5800));this.files.textContent='已检查 '+fl.toLocaleString('en-US')+' 个文件 · 用时 0:'+String(sec).padStart(2,'0');}});

/* ---------- 2. results (the core screen) ---------- */
function planOf(st){let rec=0,recC=0,recF=0;CAT.forEach(b=>{if(!st.off[b.id]){rec+=b.gb;recC+=b.C;recF+=b.F;}});let ch=0,chC=0,chF=0;CARDS.forEach(c=>{const d=st.dec[c.id];if(d&&d.mode==='clean'){ch+=c.gb;if(c.drv==='C')chC+=c.gb;else chF+=c.gb;}});const skip=st.off.br?0:.4;return{rec,ch,total:rec+ch,after:{C:DRV.C.free+recC-skip+chC,F:DRV.F.free+recF+chF}};}
const TIP_IDS=['ai','br','up','ot','dv'];
scene('results',{dur:0,
 build(el){const st=this.st||(this.st={view:Q.v==='whole'?'whole':'scope',off:{},dec:{}});const self=this;this.hot=null;this.rows={};
  const R=this.R=stage(el,st.view),G=R.G;debugOverlay(R);
  R.onHover=h=>{self.hot=h;};R.onClick=h=>{if(CAT.some(c=>c.id===h)){st.off[h]=!st.off[h];self.sync();}else if(cardOf(h)&&!st.dec[h])self.decide(h,'clean');};
  const P=panel(el);
  const top=H('div','ptop',P);segP(top,[['scope','本次范围'],['whole','本机全部']],st.view,v=>{st.view=v;show('results',{live:true});});const rl=H('button','link',top,'重新体检');rl.onclick=()=>show('scan',{play:true});
  const sc=H('div','pcap',P);sc.append('这次看了 ');H('b',null,sc,'C 盘常用位置、F 盘');sc.append(' · 10 分钟前');
  heroP(P,'可以放心清理','15.4');
  const mk=H('div','pcap',P);mk.append('缓存 12.1 GB · 旧版本 3.3 GB · ');H('span',null,mk,'比上次多 2.1 GB').style.color='var(--w-growth)';
  this.btn=H('button','btn btn-primary pbtn',P,'清理推荐项 15.4 GB');this.btn.style.marginTop='12px';this.btn.onclick=()=>show('clean',{play:true});
  this.s1=psec(P,'水面以上 · 推荐清理','15.4 GB');H('div','pnote',P,NOTE);
  CAT.forEach(b=>{const r=prow(P,{sw:b.c,n:b.n,s:f1(b.gb)+' GB'});r.classList.add('click');r.title='点一下：这次不清';r.onclick=()=>{st.off[b.id]=!st.off[b.id];self.sync();};this.rows[b.id]=r;hoverRow(this,r,b.id);});
  this.skipCap=H('div','pcap',P,'');
  psec(P,'水面下 · 需要你看','5 项 · 10.7 GB');H('div','pnote',P,NOTE2);
  CARDS.forEach(c=>{const d=H('div','drow',P);const l1=H('div','l1',d);const sw=H('i','cs',l1);swatch(sw,catOf(c.cat).c,{review:true});const nm=H('span','nm',l1,c.n);nm.title=c.n+'（'+catOf(c.cat).n+'）';H('span','sz',l1,f1(c.gb)+' GB');
   const l2=H('div','l2',d);H('span','ev'+(c.leak?' grow':''),l2,c.drv+' 盘 · '+c.ev);const kb=H('button','btn btn-glass',l2,'保留');const cb=H('button','btn btn-outline',l2,'清理');d._dn=H('span','dn',l2);
   kb.onclick=()=>self.decide(c.id,'keep');cb.onclick=()=>self.decide(c.id,'clean');this.rows[c.id]=d;hoverRow(this,d,c.id);});
  const s3=psec(P,'各盘','');H('small',null,s3._r,'浅色带 = 可用');
  this.after={};G.body.keys.forEach(k=>{const d=DRV[k];const r=drvRow(P,k,'可用 '+f1(d.free)+' GB');
   if(k==='E'){r._s.textContent='快满了';r._s.classList.add('warn');}else if(k==='D'){r._s.textContent='共 97.4 GB';r._s.classList.add('mut');}else{this.after[k]=r._s;r._s.classList.add('acc');}this.rows['p'+k]=r;hoverRow(this,r,'p'+k);});
  const pr=prow(P,{sw:VIOLET,n:'受保护 · 会话记录、登录数据',s:f1(PROTECTED)+' GB'});this.rows.core=pr;hoverRow(this,pr,'core');
  this.sync();},
 decide(id,m){const st=this.st;if(m)st.dec[id]={mode:m};else delete st.dec[id];this.sync();},
 sync(){const st=this.st,pl=planOf(st),self=this;
  const changed=pl.ch>0||CAT.some(b=>st.off[b.id]);
  this.btn.textContent=(changed?'清理 ':'清理推荐项 ')+f1(pl.total)+' GB';this.s1._r.textContent=f1(pl.rec)+' GB';
  CAT.forEach(b=>this.rows[b.id].classList.toggle('off',!!st.off[b.id]));
  this.skipCap.textContent='C 盘 14.0 · F 盘 1.4'+(st.off.br?'':' · Chrome 开着，跳过约 0.4');
  CARDS.forEach(c=>{const d=st.dec[c.id],row=this.rows[c.id];row.classList.toggle('decided',!!d);clear(row._dn);
   if(d){row._dn.append(d.mode==='clean'?'已加入清理，会整块放进隔离区 · ':'已保留，这次不清 · ');const u=H('button','link',row._dn,'撤销');u.style.fontSize='12px';u.onclick=()=>self.decide(c.id,null);}});
  Object.keys(this.after).forEach(k=>{this.after[k].textContent='清理后约 '+f1(pl.after[k]);});},
 update(t,amb){const R=this.R,G=R.G,st=this.st,hot=this.hot;clear(R.gLead);
  const items=[];
  G.body.pieces.forEach(p=>{const it=itemOf(G,p.id);const d=st.dec[p.id];if(d&&d.mode==='keep'){it.mat='frost';it.mark=null;}if(d&&d.mode==='clean')it.mark='chosen';it.hot=hot!=null&&it.hid===hot;items.push(it);});
  TIP_IDS.forEach(id=>{const it=itemOf(G,id);if(st.off[id])it.mat='off';it.hot=hot===id;items.push(it);});
  const tags=[];['ai','br','dv','up','ot','core','codex','kimi','avd','apk','w35b'].forEach(id=>{const c=tagFor(G,id,st.off[id]?.45:1,hot===id);if(c)tags.push(c);});
  layoutTags(R,tags);render(R,{items,amb});drawTags(R,tags);drawDriveTags(R,driveTags(R,G.body.keys,1,null,hot));
  const a=hotPoint(R,hot);if(a)lead(R.gLead,a[0],a[1],this.rows[hot],true);
  markHot(this);}});

/* ---------- 3. clean: tip pieces dissolve top-down into pixel particles; chosen review pieces float whole to the tray ---------- */
const CLEAN={order:[['ot',600,800],['up',1500,900],['dv',2500,900],['br',3500,1000],['ai',4600,1300]],skip:{br:.4},chosen:[{id:'w35b',well:2,t0:250},{id:'codex',well:1,t0:450}],dur:6000};
function cleanState(t){const g={},p={};let fC=0,fF=0;CLEAN.order.forEach(o=>{const b=catOf(o[0]);const keep=CLEAN.skip[b.id]||0,net=b.gb-keep;const q=easeQ(seg(t,o[1],o[1]+o[2]));const gone=net*q;g[b.id]=b.gb-gone;p[b.id]=q;fC+=gone*((b.C-keep)/net);fF+=gone*(b.F/net);});return{g,p,fC,fF};}
const OLDQ=[[0,-14],[12,-6],[13,8],[0,15],[-12,8],[-13,-7]];
function fitInto(p,well){const bb=bbox(p.poly),k=Math.min((well.w-10)/bb.w,(well.h-10)/bb.h,1);return{k,x:well.x+well.w/2,y:well.y+well.h/2};}
function trayItem(poly,cat,well,o){const p={id:'tray',kind:'item',cat,poly,facets:[],c:centroid(poly),anchor:centroid(poly)};const f=fitInto(p,well);return Object.assign({p,mat:cat,layer:'top',hid:'tray',dx:f.x-p.c[0],dy:f.y-p.c[1],sc:f.k},o||{});}
function ghostItem(G,p){return{p,mat:'n'+p.drv,layer:'body',hid:'p'+p.drv};}
scene('clean',{dur:CLEAN.dur,
 build(el){this.rows={};const R=this.R=stage(el,'scope');this.tray=trayGeo(YW);
  const P=panel(el);ptitle(P,'正在清理','推荐的缓存直接删除；你选的 2 项先放进隔离区，还在原来的盘上。');
  this.num=heroP(P,'已腾出','0.0');
  psec(P,'推荐清理','15.4 GB');H('div','pnote',P,'从冰山顶上开始，一类一类化掉');
  CLEAN.order.forEach(o=>{const b=catOf(o[0]);this.rows[b.id]=prow(P,{ic:true,sw:b.c,n:b.n,s:f1(b.gb)+' GB',x:''});});
  psec(P,'放进隔离区','3.6 GB');
  this.rows.w35b=prow(P,{ic:true,sw:catOf('dv').c,review:true,n:'.tmp_w35b 目录',s:'2.1 GB',x:''});
  this.rows.codex=prow(P,{ic:true,sw:catOf('ai').c,review:true,n:'Codex 旧运行时',s:'1.5 GB',x:''});
  psec(P,'各盘','浅色带变厚');this.dr={};['C','F'].forEach(k=>{const r=drvRow(P,k,'可用 '+f1(DRV[k].free)+' →');this.dr[k]=r._s;r._s.classList.add('acc');});
  psec(P,'隔离区');this.qr=prow(P,{n:'1.2 GB →',s:''});
  H('div','pfoot pcap',P,'冰山尖从顶上一块一块化掉；你选的两块不化，整块浮进制冰盒（隔离区）。');},
 update(t,amb){const R=this.R,G=R.G,cs=cleanState(t),items=[],px=[],tray=this.tray;
  G.body.pieces.forEach(p=>{const ch=CLEAN.chosen.find(c=>c.id===p.id);if(!ch){items.push(itemOf(G,p.id));return;}const lift=easeOut(seg(t,ch.t0,ch.t0+500));items.push(ghostItem(G,p));if(lift<1)items.push(itemOf(G,p.id,{op:1-lift}));});
  CLEAN.order.forEach(o=>{const id=o[0],p=G.tip[id],b=catOf(id),frac=cs.g[id]/b.gb;if(frac<=.001)return;const y=cutYFor(p.poly,frac);items.push(itemOf(G,id,{cut:frac<.999?y:null}));
   if(cs.p[id]>0&&(cs.p[id]<1||t<o[1]+o[2]+500)){const bb=bbox(p.poly),r=rng(o[1]),tint=mix(b.c,'#FFFFFF',.55);for(let j=0;j<26;j++){const born=o[1]+j*o[2]/26,age=t-born;if(age<0||age>1100)continue;const q=age/1100,yb=cutYFor(p.poly,1-(1-(CLEAN.skip[id]||0)/b.gb)*easeQ(seg(born,o[1],o[1]+o[2])));
     const xs=[];for(let x=bb.x0;x<=bb.x1;x+=3)if(pip(p.poly,x,yb+2))xs.push(x);if(!xs.length)continue;const x=xs[Math.floor(r()*xs.length)]+(r()-.5)*6+Math.sin(q*5+j)*6,yy=yb-q*(30+r()*36);px.push([x,yy,4+5*r()*(1-q*.5),rgba(j%3?'#FFFFFF':tint,(.75*(1-q)).toFixed(3))]);}}});
  CLEAN.chosen.forEach(c=>{const p=G.byId[c.id];const lift=easeOut(seg(t,c.t0,c.t0+500)),fl=easeIO(seg(t,c.t0+500,c.t0+1700));if(lift<=0)return;
   const f=fitInto(p,tray.wells[c.well]);const ux=p.c[0],uy=p.c[1]-26*lift,cx=lerp(ux,f.x,.5),cy=Math.min(uy,f.y)-90;const x=(1-fl)*(1-fl)*ux+2*(1-fl)*fl*cx+fl*fl*f.x,y=(1-fl)*(1-fl)*uy+2*(1-fl)*fl*cy+fl*fl*f.y;
   items.push(itemOf(G,c.id,{dx:x-p.c[0],dy:y-p.c[1],sc:lerp(1,f.k,fl),layer:'top',mark:null}));});
  items.push(trayItem(OLDQ.map(q=>[q[0]+500,q[1]+500]),'ai',tray.wells[0],{op:.75}));
  const r1=v=>Math.round(v*10)/10,freeC=DRV.C.free+cs.fC,freeF=DRV.F.free+cs.fF,dC=r1(freeC),dF=r1(freeF);
  const tags=[];CLEAN.order.forEach(o=>{if(cs.p[o[0]]<=0){const c=tagFor(G,o[0],1,false);if(c)tags.push(c);}});['core','codex','kimi','avd','apk','w35b'].forEach(id=>{const ch=CLEAN.chosen.find(c=>c.id===id);const a=ch?1-seg(t,ch.t0,ch.t0+300):1;if(a>0){const c=tagFor(G,id,a,false);if(c)tags.push(c);}});
  R.setCam(1,YW);layoutTags(R,tags,{skyBottom:84});
  render(R,{items,amb,px,tray,grow:{C:freeC,F:freeF}});drawTags(R,tags);drawDriveTags(R,driveTags(R,['C','F'],1,{C:dC,F:dF}));
  /* the hero is the sum of the two drive rows as shown */
  this.num.textContent=f1(r1(dC-DRV.C.free)+r1(dF-DRV.F.free));this.dr.C.textContent=f1(dC)+' GB';this.dr.F.textContent=f1(dF)+' GB';
  const qin=CLEAN.chosen.reduce((a,c)=>a+(t>=c.t0+1700?cardOf(c.id).gb:0),0);this.qr._s.textContent=f1(1.2+qin)+' GB';
  CLEAN.order.forEach(o=>{const r=this.rows[o[0]],p=cs.p[o[0]];setIc(r,p>=1?'ok':(p>0?'run':'wait'));r._x.textContent=p>=1?(CLEAN.skip[o[0]]?'跳过 0.4':'已清理'):(p>0?'清理中':'等待');});
  CLEAN.chosen.forEach(c=>{const qp=seg(t,c.t0,c.t0+1700);setIc(this.rows[c.id],qp>=1?'ok':(qp>0?'run':'wait'));this.rows[c.id]._x.textContent=qp>=1?'已放入':(qp>0?'移动中':'等待');});}});

/* ---------- 4. done ---------- */
scene('done',{dur:2600,
 build(el){this.rows={};this.hot=null;const R=this.R=stage(el,'scope'),G=R.G;this.tray=trayGeo(YW);const self=this;R.onHover=h=>{self.hot=h;};
  const P=panel(el);ptitle(P,'清理完成');
  heroP(P,'已腾出','15.0');
  const l1=H('div','pcap',P);l1.append('另有 ');H('b',null,l1,'3.6 GB');l1.append(' 在隔离区，确认没问题后再永久删除。');
  psec(P,'各盘','浅色带变厚了');
  [['C','63.4','77.0','+13.6'],['F','372.7','374.1','+1.4']].forEach(d=>{const r=drvRow(P,d[0],'可用 '+d[1]+' → '+d[2]+' GB');r._s.textContent=d[3];r._s.classList.add('okt');this.rows['p'+d[0]]=r;});
  psec(P,'还在的');H('div','pnote',P,NOTE2);
  this.rows.br=prow(P,{sw:catOf('br').c,n:'浏览器缓存 · Chrome 开着，跳过了',s:'0.4 GB'});
  this.rows.tray=prow(P,{sw:'#D8EAEF',n:'隔离区（这次放进 3.6 GB）',s:'4.8 GB'});
  ['avd','apk','kimi'].forEach(id=>{const c=cardOf(id);this.rows[id]=prow(P,{sw:catOf(c.cat).c,review:true,n:c.n+' · 没决定',s:f1(c.gb)+' GB'});});
  this.rows.core=prow(P,{sw:VIOLET,n:'受保护',s:f1(PROTECTED)+' GB'});
  Object.keys(this.rows).forEach(id=>{if(id[0]!=='p')hoverRow(this,this.rows[id],id);});
  const ft=H('div','pfoot',P);const b=H('button','btn btn-primary pbtn',ft,'完成');b.onclick=()=>show('results');},
 update(t,amb){const R=this.R,G=R.G,tray=this.tray,hot=this.hot;clear(R.gLead);R.setCam(1,YW);
  const items=[];G.body.pieces.forEach(p=>{if(CLEAN.chosen.some(c=>c.id===p.id))items.push(ghostItem(G,p));else{const it=itemOf(G,p.id);it.hot=hot!=null&&it.hid===hot;items.push(it);}});
  const br=G.tip.br,cy=cutYFor(br.poly,.4/3.4);items.push(itemOf(G,'br',{cut:cy,hot:hot==='br'}));
  items.push(trayItem(OLDQ.map(q=>[q[0]+500,q[1]+500]),'ai',tray.wells[0],{op:.75}));items.push(trayItem(G.byId.codex.poly,'ai',tray.wells[1]));items.push(trayItem(G.byId.w35b.poly,'dv',tray.wells[2]));
  const tags=[];['core','kimi','avd','apk'].forEach(id=>{const c=tagFor(G,id,1,hot===id);if(c)tags.push(c);});
  layoutTags(R,tags,{skyBottom:84});render(R,{items,amb,tray,grow:{C:77.0,F:374.1}});drawTags(R,tags);drawDriveTags(R,driveTags(R,['C','F'],1,{C:77.0,F:374.1},hot));
  if(hot==='br'){const bb=bbox(clipHalf(br.poly,0,-1,-cy));lead(R.gLead,(bb.x0+bb.x1)/2,(bb.y0+bb.y1)/2,this.rows.br,true);}
  else if(hot==='tray'){const w=tray.wells[1];lead(R.gLead,w.x+w.w/2,w.y+w.h/2,this.rows.tray,true);}
  else{const a=hotPoint(R,hot);if(a)lead(R.gLead,a[0],a[1],this.rows[hot],true);}
  markHot(this);}});

/* ---------- boot ---------- */
const sb=document.getElementById('sceneBtns');ORDER.forEach(o=>{if(!SC[o[0]])return;const b=H('button',null,sb,o[1]);b.dataset.s=o[0];b.onclick=()=>show(o[0]);});
document.getElementById('playScan').onclick=()=>show('scan',{play:true});
document.getElementById('playClean').onclick=()=>show('clean',{play:true});
document.getElementById('replay').onclick=()=>show(cur?cur.id:'scan',{play:true});
if(SHOT)document.body.classList.add('shot');
if(Q.perf){const ts=[];let last=0;const tick=n=>{if(last)ts.push(n-last);last=n;if(ts.length<240)requestAnimationFrame(tick);else{ts.sort((a,b)=>a-b);document.documentElement.setAttribute('data-perf','median '+ts[120].toFixed(1)+' ms, p90 '+ts[216].toFixed(1)+' ms, max '+ts[239].toFixed(1)+' ms');}};requestAnimationFrame(tick);}
show(SC[Q.s]?Q.s:'results',{play:!!Q.play});
})();
