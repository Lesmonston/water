<style>
/* Design prototype only (wave 10). The iceberg is ASSEMBLED from pieces while the scan runs:
   a precomputed silhouette is cut into a jigsaw (power-diagram cells with shared edges), tip = one piece per
   recommended category, body = one region per drive (free band on top, needs-review items, protected data, plain ice).
   Picture style: original 2D pixel art in a bright layered sea, drawn in software into a 363×291 canvas and scaled 3×
   with nearest-neighbour. Tags and the panel are crisp UI on top. No images, no fonts or scripts from the network. */
/* token fallbacks (same values as tokens.css), so the page still renders if tokens.css is not next to it */
:root{--w-ink:#10263F;--w-ink-2:rgba(16,38,63,.66);--w-ink-3:rgba(16,38,63,.48);--w-ink-4:rgba(16,38,63,.28);--w-hairline:rgba(16,38,63,.07);
 --w-accent:#1F6FD1;--w-accent-hover:#1A62BA;--w-accent-soft:#E4EFFB;
 --w-level-recommended:#2A9D8F;--w-level-confirm:#D49A3E;--w-level-advisory:#9AA7B6;--w-level-protected:#8E84D8;
 --w-growth:#B5652A;--w-danger:#C23B45;--w-success:#2A8F6E;
 --w-font:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","PingFang SC",system-ui,sans-serif;
 --w-font-display:"Segoe UI Variable Display","Segoe UI","Microsoft YaHei UI",system-ui,sans-serif;--w-font-mono:"Cascadia Mono",Consolas,monospace;
 --w-ease:cubic-bezier(.22,.8,.2,1);

*{box-sizing:border-box}html,body{margin:0}
body{font:14px/1.5 var(--w-font);color:var(--w-ink);padding:14px;min-width:1300px;font-feature-settings:"tnum";background:#DCEBF5}

button{font:inherit;color:inherit}

.bar{width:1272px;margin:0 auto 12px;display:flex;flex-wrap:wrap;gap:2px;align-items:center;padding:5px;border-radius:16px;background:#fff;box-shadow:0 0 0 2px var(--g-line)}
.bar strong{font-size:12px;color:var(--w-ink-3);padding:0 10px 0 12px;font-weight:600}
.bar button{border:0;background:none;border-radius:10px;padding:4px 11px;font-size:12.5px;color:var(--w-ink-2);cursor:pointer;font-weight:600}
.bar button[aria-pressed=true]{background:var(--g-soft);color:var(--w-ink)}
.bar .sp{flex:1}.bar .play{color:var(--g-accent);font-weight:700}
body.shot .bar{display:none}

.win{position:relative;width:1272px;height:872px;margin:0 auto;border-radius:14px;overflow:hidden;background:#F4F9FD;box-shadow:0 0 0 2px var(--g-line),0 30px 70px -34px rgba(16,40,80,.45)}

.titlebar span{width:46px;height:40px;display:grid;place-items:center}.titlebar svg{width:14px;height:14px}
.side{position:absolute;left:0;top:0;bottom:0;width:184px;padding:14px 10px 16px;display:flex;flex-direction:column;background:#FFFFFF;box-shadow:inset -2px 0 0 var(--g-line);z-index:3}

.layer{position:absolute;left:0;top:0;width:1088px;height:872px;overflow:visible;pointer-events:none}
.tagt{font-family:"Microsoft YaHei UI","Microsoft YaHei","Segoe UI",sans-serif}

.pfoot{margin-top:auto;padding-top:12px}
.pbtn{width:100%}

.okc{width:14px;height:14px;color:var(--w-success)}
